# Standardmäßig aus: Die Gesamtliste hat rund 8.000 Angebote. Für einen sinnvollen Abruf brauchst du
# die Adresse mit gesetztem Filter „max. Monatsrate 150 €“ und Sortierung „Rate aufsteigend“:
# im Browser einstellen, Adresse kopieren, unten eintragen, dann enabled = true setzen.
enabled = false
start_urls = ["https://www.goleasy.de/leasing/privat"]
page_params = ["page"]
max_pages = 40
sorted_ascending = true
link_hint = "/leasing/"
