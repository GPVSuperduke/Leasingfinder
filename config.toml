# Leasing-Radar – Einstellungen
# Änderungen werden beim nächsten täglichen Lauf übernommen (oder sofort über „Run workflow“).

[search]
max_rate = 150          # höchste Monatsrate in Euro (inkl. MwSt.)
customer = "privat"     # privat | gewerbe | beide
condition = "alle"      # alle | neu | gebraucht

[http]
# Ehrlicher User-Agent: Das Skript gibt sich nicht als normaler Browser aus.
user_agent = "Mozilla/5.0 (compatible; LeasingRadar/1.0; persönliches Projekt)"
delay_seconds = 2.5     # Pause zwischen zwei Abrufen beim selben Portal
timeout_seconds = 30
respect_robots = true   # robots.txt der Portale beachten

[output]
data_file = "docs/data/offers.json"
history_file = "data/history.json"
debug_dir = "debug"

# ------------------------------------------------------------------------------------------
# Quellen. Jede Quelle braucht mindestens eine Start-URL mit Angebotsliste.
# Tipp: Wenn ein Portal nichts liefert, im Browser die Liste mit Filter „bis 150 €“ öffnen,
# die Adresse kopieren und hier als start_urls eintragen.
# ------------------------------------------------------------------------------------------

[[source]]
id = "leasingmarkt"
name = "LeasingMarkt.de"
enabled = true
# Privatleasing, Rate bis 150 € – der Filter läuft direkt über die Adresse (tg=PRIVATE, mglpt=150).
start_urls = ["https://www.leasingmarkt.de/listing?tg=PRIVATE&nc=1&mglpt=150"]
page_params = ["page", "pg", "p"]
max_pages = 60
default_customer = "privat"
link_hint = "/leasing/pkw/"

